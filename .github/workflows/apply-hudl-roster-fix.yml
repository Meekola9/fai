name: Apply Hudl roster preservation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hudl-import-preserve-roster
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace destructive full-data import with batch film append
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/store/useStore.tsx',
              "  addFilmPlay: (film: Omit<FilmPlay, 'id' | 'createdAt'>) => string\n  updateFilmPlay: (film: FilmPlay) => void",
              "  addFilmPlay: (film: Omit<FilmPlay, 'id' | 'createdAt'>) => string\n  addFilmPlays: (films: FilmPlay[]) => void\n  updateFilmPlay: (film: FilmPlay) => void",
          )

          replace_once(
              'src/store/useStore.tsx',
              "    addFilmPlay(film) {\n      const id = newId('film')\n      const createdAt = new Date().toISOString()\n      mutate((current) => ({\n        ...current,\n        filmPlays: [...current.filmPlays, { ...film, id, createdAt }],\n      }))\n      return id\n    },\n    updateFilmPlay(film) {",
              "    addFilmPlay(film) {\n      const id = newId('film')\n      const createdAt = new Date().toISOString()\n      mutate((current) => ({\n        ...current,\n        filmPlays: [...current.filmPlays, { ...film, id, createdAt }],\n      }))\n      return id\n    },\n    addFilmPlays(films) {\n      mutate((current) => {\n        const existingIds = new Set(current.filmPlays.map((film) => film.id))\n        const additions = films.filter((film) => !existingIds.has(film.id))\n        return {\n          ...current,\n          filmPlays: [...current.filmPlays, ...additions],\n        }\n      })\n    },\n    updateFilmPlay(film) {",
          )

          replace_once(
              'src/components/HudlImportWizard.tsx',
              "  const { data, replaceAll, canEdit } = useStore()",
              "  const { data, addFilmPlays, canEdit } = useStore()",
          )

          replace_once(
              'src/components/HudlImportWizard.tsx',
              "    replaceAll({ ...data, filmPlays: [...data.filmPlays, ...records] })",
              "    addFilmPlays(records)",
          )

          test = Path('src/lib/hudlRosterPreservation.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport type { AppData, FilmPlay } from '../types'\n\nfunction appendFilms(current: Required<AppData>, films: FilmPlay[]): Required<AppData> {\n  const existingIds = new Set(current.filmPlays.map((film) => film.id))\n  return {\n    ...current,\n    filmPlays: [...current.filmPlays, ...films.filter((film) => !existingIds.has(film.id))],\n  }\n}\n\ndescribe('Hudl batch film import', () => {\n  it('preserves the complete roster and every non-film dataset', () => {\n    const current: Required<AppData> = {\n      athletes: [{ id: 'athlete-1', name: 'Player One', grade: 11, position: 'WR', positionGroup: 'WR', heightIn: 70, weightLbs: 170 }],\n      events: [{ id: 'event-1', name: 'Testing', phase: 'Summer', startDate: '2026-07-01', status: 'open' }],\n      sessions: [],\n      plays: [],\n      filmPlays: [],\n      awarenessResults: [],\n    }\n    const incoming: FilmPlay[] = [{ id: 'film-1', formation: 'trips' }]\n    const next = appendFilms(current, incoming)\n\n    expect(next.athletes).toEqual(current.athletes)\n    expect(next.events).toEqual(current.events)\n    expect(next.sessions).toEqual(current.sessions)\n    expect(next.plays).toEqual(current.plays)\n    expect(next.awarenessResults).toEqual(current.awarenessResults)\n    expect(next.filmPlays).toEqual(incoming)\n  })\n})\n""")
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.tsx src/components/HudlImportWizard.tsx src/lib/hudlRosterPreservation.test.ts
          git commit -m "Prevent Hudl imports from replacing roster data"
          git push origin HEAD:fix/hudl-import-preserve-roster
