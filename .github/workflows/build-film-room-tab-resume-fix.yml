name: Build Film Room tab resume fix

on:
  push:
    branches:
      - fix/film-room-tab-resume
    paths:
      - .github/workflows/build-film-room-tab-resume-fix.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/film-room-tab-resume
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply tab resume fix
        run: python scripts/applyFilmRoomTabResumeFix.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Route health
        run: npm run test:e2e -- e2e/route-health.spec.ts

      - name: Commit validated fix
        run: |
          git config user.name "FAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/store/useStore.tsx src/store/authLifecycle.ts src/store/authLifecycle.test.ts
          git rm scripts/applyFilmRoomTabResumeFix.py .github/workflows/build-film-room-tab-resume-fix.yml
          git commit -m "Keep Film Room mounted across tab resume"
          git push origin HEAD:fix/film-room-tab-resume
