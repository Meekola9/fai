name: Fix Fieldhouse navigation

on:
  push:
    branches:
      - feature/human-centered-design-and-deployment-roles

permissions:
  contents: write

jobs:
  fix-nav:
    if: ${{ !contains(github.event.head_commit.message, '[fieldhouse-nav-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-centered-design-and-deployment-roles
          fetch-depth: 0
      - name: Fix responsive navigation
        run: python scripts/fixFieldhouseNav.py
      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: respect mobile navigation breakpoint [fieldhouse-nav-fixed]"
          git push origin HEAD:feature/human-centered-design-and-deployment-roles
