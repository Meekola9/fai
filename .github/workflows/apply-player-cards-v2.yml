name: Apply player cards v2

on:
  push:
    branches: [main]
    paths:
      - .github/player-cards-v2-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-cards-home-development-v2
          fetch-depth: 0
      - name: Copy validated card feature onto current main
        run: |
          git fetch origin feature/player-cards-home-development
          git checkout origin/feature/player-cards-home-development -- \
            src/components/AthletePlayerCard.tsx \
            src/components/HomeDevelopmentPlan.tsx \
            src/lib/homeTraining.ts \
            src/pages/AthleteProfile.tsx \
            src/pages/MyAthleteAccount.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AthletePlayerCard.tsx src/components/HomeDevelopmentPlan.tsx src/lib/homeTraining.ts src/pages/AthleteProfile.tsx src/pages/MyAthleteAccount.tsx
          git commit -m "Add collectible player cards and home development plans"
          git push origin HEAD:feature/player-cards-home-development-v2
