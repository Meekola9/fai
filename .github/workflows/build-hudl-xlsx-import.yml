name: Build Hudl XLSX breakdown import

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hudl-xlsx-breakdown-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrate Excel breakdown upload
        run: python scripts/applyHudlXlsxImport.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "FAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/HudlImportWizard.tsx src/lib/hudlWorkbook.ts src/lib/hudlWorkbook.test.ts
          git rm scripts/applyHudlXlsxImport.py .github/workflows/build-hudl-xlsx-import.yml
          git commit -m "Support Hudl Excel breakdown imports"
          git push origin HEAD:feature/hudl-xlsx-breakdown-import
