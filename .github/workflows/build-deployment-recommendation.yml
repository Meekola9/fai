name: Build deployment recommendation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/deployment-recommendation-and-iron-man-package

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title, '[deployment-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-recommendation-and-iron-man-package
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct the two profile-summary replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/applyDeploymentRecommendation.py')
          text = path.read_text()
          block = '''replace_once(
              'src/pages/AthleteProfile.tsx',
              "<PlayerUsageSummary usage={athlete.usage} />",
              "<PlayerUsageSummary athlete={athlete} />",
          )
          replace_once(
              'src/pages/AthleteProfile.tsx',
              "<PlayerUsageSummary usage={athlete.usage} />",
              "<PlayerUsageSummary athlete={athlete} />",
          )'''
          replacement = '''profile_path = Path('src/pages/AthleteProfile.tsx')
          profile_text = profile_path.read_text()
          old_summary = "<PlayerUsageSummary usage={athlete.usage} />"
          if profile_text.count(old_summary) != 2:
              raise SystemExit(f"AthleteProfile: expected two deployment summaries, found {profile_text.count(old_summary)}")
          profile_path.write_text(profile_text.replace(old_summary, "<PlayerUsageSummary athlete={athlete} />"))'''
          if block not in text:
              raise SystemExit('Could not find duplicate profile replacement block')
          path.write_text(text.replace(block, replacement, 1))
          PY
      - name: Apply deployment recommendation implementation
        run: python scripts/applyDeploymentRecommendation.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm -f scripts/applyDeploymentRecommendation.py .github/workflows/build-deployment-recommendation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add deployment recommendation and Iron Man package editor [deployment-built]"
          git push origin HEAD:feature/deployment-recommendation-and-iron-man-package
