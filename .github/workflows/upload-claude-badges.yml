name: Upload Claude Badge Art

on:
  push:
    branches:
      - feature/upload-claude-badges

permissions:
  contents: write

jobs:
  upload-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/upload-claude-badges
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download all Claude badge medallions
        run: node scripts/fetch-badge-art.mjs

      - name: Verify complete badge set
        shell: bash
        run: |
          set -euo pipefail
          count="$(find src/assets/badges -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$count" = "39"
          while IFS= read -r file; do
            test -s "$file"
            file "$file" | grep -qi 'Web/P image'
          done < <(find src/assets/badges -maxdepth 1 -type f -name '*.webp' | sort)
          echo "Verified $count WebP badge assets."

      - name: Validate app with generated artwork
        run: |
          npm run lint
          npm test
          npm run build

      - name: Remove temporary upload staging
        run: |
          rm -f src/assets/badges/.upload-check
          rm -f src/assets/badges/all-around-growth.webp.b64
          rm -f .github/workflows/upload-claude-badges.yml

      - name: Commit badge assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No badge changes to commit.'; exit 0; }
          git commit -m 'Add Claude-generated badge artwork'
          git push origin HEAD:feature/upload-claude-badges
