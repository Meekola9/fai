name: Build Football CV importer

on:
  push:
    branches:
      - feature/football-cv-film-room-import

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[football-cv-importer-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/football-cv-film-room-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate Football CV importer
        run: python scripts/applyFootballCvImporter.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Football CV import acceptance
        run: npm run test:e2e -- e2e/football-cv-import.spec.ts
      - name: Route health
        run: npm run test:e2e -- e2e/route-health.spec.ts
      - name: Commit validated implementation
        run: |
          rm -f scripts/applyFootballCvImporter.py .github/workflows/build-football-cv-importer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Football CV tracking import to Film Room [football-cv-importer-built]"
          git push origin HEAD:feature/football-cv-film-room-import
