name: Apply Hudl import release 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hudl-import-release-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire importer into Film Room
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/FilmRoom.tsx')
          text = path.read_text()

          import_anchor = "import { Card, Pill, SectionTitle, StatTile } from '../components/ui'\n"
          import_line = "import HudlImportWizard from '../components/HudlImportWizard'\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Film Room UI import anchor changed')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          render_anchor = '''      <div className="grid gap-6 lg:grid-cols-[3fr_2fr]">'''
          render_line = '''      <HudlImportWizard />\n\n'''
          if '<HudlImportWizard />' not in text:
              if text.count(render_anchor) != 1:
                  raise SystemExit('Film Room layout anchor changed')
              text = text.replace(render_anchor, render_line + render_anchor, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FilmRoom.tsx
          git commit -m "Wire Hudl import wizard into Film Room"
          git push origin HEAD:feature/hudl-import-release-1

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          git worktree add /tmp/fai-main origin/main
          cd /tmp/fai-main
          git checkout -B main origin/main
          rm .github/workflows/apply-hudl-import-release-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Hudl import patch workflow"
          git push origin HEAD:main
