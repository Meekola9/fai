name: Apply QB mechanics panel

on:
  push:
    branches:
      - feature/qb-mechanics-grading

permissions:
  contents: write

jobs:
  patch-film-room:
    if: ${{ !contains(github.event.head_commit.message, '[qb-mechanics-panel]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qb-mechanics-grading
          fetch-depth: 0
      - name: Apply Film Room integration
        run: python scripts/applyQbMechanicsPanel.py
      - name: Commit Film Room integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FilmRoom.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: finish QB mechanics Film Room integration [qb-mechanics-panel]"
          git push origin HEAD:feature/qb-mechanics-grading
