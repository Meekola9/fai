name: Finalize Fieldhouse

on:
  push:
    branches:
      - feature/human-centered-design-and-deployment-roles

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[fieldhouse-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-centered-design-and-deployment-roles
          fetch-depth: 0
      - name: Apply final cleanup
        run: python scripts/finalizeFieldhouse.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AthleteEditor.tsx src/pages/AthleteProfile.tsx src/pages/Athletes.tsx src/pages/Dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize Fieldhouse integration [fieldhouse-finalized]"
          git push origin HEAD:feature/human-centered-design-and-deployment-roles
