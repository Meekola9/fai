name: FAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/claude-badge-medallions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download generated medallions
        run: node scripts/fetch-badge-art.mjs
      - name: Verify exact artwork set
        shell: bash
        run: |
          count=$(find src/assets/badges -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')
          test "$count" = "39"
          while IFS= read -r id; do
            test -s "src/assets/badges/$id.webp"
          done < <(node - <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('scripts/fetch-badge-art.mjs', 'utf8')
          const block = text.match(/const ART = \{([\s\S]*?)\n\}/)?.[1] ?? ''
          for (const match of block.matchAll(/^\s*(?:'([^']+)'|([a-z][\w-]*)):\s*url/gm)) console.log(match[1] || match[2])
          NODE
          )
      - name: Install dependencies
        run: npm ci
      - name: Badge tests
        run: npm test -- src/lib/badges.test.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install mobile browser
        run: npx playwright install --with-deps chromium
      - name: Phone app acceptance
        run: npm run test:e2e -- e2e/mobile-pwa.spec.ts
      - name: Commit validated artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/install-claude-badges.yml
          rm -f .github/install-claude-badges-trigger.txt
          git add src/assets/badges .github/workflows/ci.yml .github
          git commit -m "Add Claude-generated badge medallions"
          git push origin HEAD:assets/claude-badge-medallions
