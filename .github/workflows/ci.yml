name: FAI CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trace scoring pipeline
        run: python scripts/diagnose_missing_score.py | tee scoring-diagnostic.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload scoring diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: scoring-pipeline-diagnostic
          path: scoring-diagnostic.log
          retention-days: 2
      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fai-validation-diagnostics
          path: |
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Install mobile browser
        run: npx playwright install --with-deps chromium
      - name: Phone app acceptance
        run: npm run test:e2e -- e2e/mobile-pwa.spec.ts
      - name: Upload mobile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fai-mobile-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
