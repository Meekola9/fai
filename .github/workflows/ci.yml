name: FAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/film-auto-follow-hardening
          fetch-depth: 0
      - name: Apply viewport lint correction
        run: |
          python scripts/fixAutoFollowViewportLint.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FilmRoom.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: derive auto-follow viewport without effect state [auto-follow-viewport-fix]"
            git push origin HEAD:feature/film-auto-follow-hardening
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fai-validation-diagnostics
          path: |
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Install mobile browser
        run: npx playwright install --with-deps chromium
      - name: Phone app acceptance
        run: npm run test:e2e -- e2e/mobile-pwa.spec.ts
      - name: Upload mobile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fai-mobile-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
