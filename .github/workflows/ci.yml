name: FAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/claude-badge-medallions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Badge tests
        run: npm test -- src/lib/badges.test.ts
      - name: Build
        run: npm run build
      - name: Clean upload scaffolding and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/badge-upload-cleanup-note.txt \
            .github/badge-upload-final-trigger.txt \
            .github/badge-upload-note.txt \
            .github/badge-upload-open-pr.txt \
            .github/badge-upload-pr.txt \
            .github/badge-upload-ready.txt \
            .github/badge-upload-status.txt \
            .github/badge-upload-trigger-last.txt \
            .github/zzz-stop.txt \
            BADGE_UPLOAD_README.tmp
          git add -A
          git commit -m "Remove temporary badge upload scaffolding"
          git push origin HEAD:assets/claude-badge-medallions
