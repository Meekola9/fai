name: FAI authenticated cloud smoke

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/deployment-board-smoke-test

jobs:
  two-session-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://doadxtdgprvmunwvfpnp.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jSZJvvolA0QanEHCH5lruw_ABrAuPAj
      FAI_CLOUD_SMOKE_TEAM_ID: c3c3e5fc-0273-4961-a757-fefd54176e22
      FAI_CLOUD_SMOKE_TEAM_NAME: FAI Cloud Smoke 2026-08-04
      FAI_CLOUD_SMOKE_EMAIL_A: fai-cloud-smoke-a-20260804184653@example.com
      FAI_CLOUD_SMOKE_EMAIL_B: fai-cloud-smoke-b-20260804184653@example.com
      FAI_CLOUD_SMOKE_PASSWORD: 8hwbz8WQwuyuXpe-O3fDVFDM4mESriPpH8kG2U_1TZ8Aa1!
      FAI_CLOUD_SMOKE_ATHLETE_ID: cloud-smoke-athlete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated two-session cloud smoke
        run: npm run test:e2e -- e2e/cloud-two-session.spec.ts
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-two-session-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
